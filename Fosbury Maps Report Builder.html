<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Fosbury Maps Report Builder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: sticky map column beside the working column; stacks on phones. Palette taken from a map legend: park green, road grey, brick red. */
:root{
  --bg:#EDF0EC; --surface:#FBFCFA; --ink:#16231F; --muted:#586861; --line:#D1D9D3;
  --accent:#1B6B57; --accent-ink:#FFFFFF; --chip:#E2E9E4;
  --ok:#1C7342; --ok-bg:#DDF1E3; --bad:#A92F1E; --bad-bg:#FBE3DE; --info-bg:#E6EFF4;
  --f-head:'Space Grotesk',system-ui,sans-serif; --f-body:'Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1916; --surface:#16251F; --ink:#E5EEE9; --muted:#94A69E; --line:#2B3D36;
  --accent:#52C4A2; --accent-ink:#06211A; --chip:#203129;
  --ok:#72D79A; --ok-bg:#163A27; --bad:#FF9585; --bad-bg:#44211B; --info-bg:#1A2B34; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1916; --surface:#16251F; --ink:#E5EEE9; --muted:#94A69E; --line:#2B3D36;
  --accent:#52C4A2; --accent-ink:#06211A; --chip:#203129;
  --ok:#72D79A; --ok-bg:#163A27; --bad:#FF9585; --bad-bg:#44211B; --info-bg:#1A2B34; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--f-head);line-height:1.15;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

header.top{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
h1{font-size:clamp(26px,4vw,38px)}
.team{display:flex;flex-direction:column;gap:4px;min-width:min(100%,240px)}
.team label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.team input{font:inherit;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}

.grid{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.maps{position:sticky;top:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
@media (max-width:900px){.maps{position:static}}
.maps h2{font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.maps h2 small{font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:12px}
.maps figure{margin:0;display:flex;flex-direction:column;gap:6px}
.maps figcaption{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.maps button.zoom{padding:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--chip);display:block}
.maps img{display:block;width:100%;height:auto}
@media (max-width:900px) and (min-width:560px){.maps .pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}}
.maps .pair{display:flex;flex-direction:column;gap:12px}
@media (max-width:900px) and (min-width:560px){.maps .pair{display:grid}}

nav.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
nav.tabs button{border:1.5px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:999px;font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center}
nav.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
nav.tabs .tick{width:18px;height:18px;border-radius:50%;background:var(--ok);color:#fff;display:none;place-items:center;font-size:11px;line-height:1}
nav.tabs button.done .tick{display:inline-grid}

section.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:16px}
section.panel[hidden]{display:none}
.phead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;align-items:baseline}
.phead h2{font-size:22px}
.stats{display:flex;gap:14px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink)}
.brief{margin:0;color:var(--muted);max-width:68ch}
.brief strong{color:var(--ink)}

.zonelabel{display:flex;justify-content:space-between;gap:8px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;color:var(--muted);margin-bottom:6px}
ol.zone{list-style:none;margin:0;padding:10px;border-radius:12px;display:flex;flex-direction:column;gap:8px;min-height:64px}
ol.main{background:var(--chip);counter-reset:n}
ol.junk{background:transparent;border:2px dashed var(--line)}
ol.junk:empty::before{content:"Drop cards here if they do not belong";color:var(--muted);font-size:13px;padding:10px 6px}
ol.main:empty::before{content:"Drop cards here";color:var(--muted);font-size:13px;padding:10px 6px}
li.card{display:flex;gap:10px;align-items:stretch;background:var(--surface);border:1.5px solid var(--line);border-radius:9px;padding:0;position:relative}
li.card .grip{flex:none;width:34px;display:grid;place-items:center;color:var(--muted);cursor:grab;touch-action:none;border-right:1px solid var(--line);border-radius:8px 0 0 8px;user-select:none}
li.card .txt{flex:1;min-width:0;padding:10px 0;overflow-wrap:anywhere}
li.card .tools{flex:none;display:flex;align-items:center;gap:2px;padding:4px}
li.card .tools button{border:0;background:transparent;width:30px;height:30px;border-radius:6px;color:var(--muted);font-size:15px;line-height:1}
li.card .tools button:hover{background:var(--chip);color:var(--ink)}
li.card .mark{display:none;flex:none;align-self:center;font-weight:700;font-size:13px;padding:0 4px}
li.card.ok{background:var(--ok-bg);border-color:var(--ok)}
li.card.ok .mark{display:block;color:var(--ok)}
li.card.bad{background:var(--bad-bg);border-color:var(--bad)}
li.card.bad .mark{display:block;color:var(--bad)}
li.card.sortable-ghost{opacity:.35}
li.card.sortable-chosen{box-shadow:0 6px 18px rgba(0,0,0,.18)}
.locked li.card .grip{cursor:default;opacity:.4}
.locked li.card .tools{display:none}

.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;padding:11px 20px;border-radius:9px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn[disabled]{opacity:.5;cursor:default}
.msg{flex:1;min-width:200px;font-weight:500}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}

.notes{background:var(--info-bg);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.notes h3{font-size:16px}
.notes ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.notes .talk{border-top:1px solid var(--line);padding-top:10px;font-weight:500}
.final{margin:0;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;font-size:15px}

table.res{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.res th,table.res td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
table.res th{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.tablewrap{overflow-x:auto}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--chip);color:var(--muted)}
.badge.ok{background:var(--ok-bg);color:var(--ok)}

.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.82);display:grid;place-items:center;padding:20px;z-index:50}
.lightbox[hidden]{display:none}
.lightbox img{max-width:min(96vw,1100px);max-height:90vh;border-radius:8px;background:#fff}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

{id:'intro',tab:'Intro & Overview',title:'Introduction and overview',
 brief:'Build the <strong>introduction</strong> (paraphrase the question) followed by the <strong>overview</strong> (the big picture, no detail). Each card is part of a sentence. Two cards are intruders.',
 cards:[
  {id:'r1',k:0,t:'The given maps illustrate how the suburb of Fosbury town altered'},
  {id:'r2',k:1,t:'from 1980 to 2015.'},
  {id:'r3',k:2,t:'It can be seen that the town witnessed significant developments,'},
  {id:'r4',k:3,t:'in terms of the introduction of an industrial feature and road layout'},
  {id:'r5',k:4,t:'and changes in residential and sporting facilities'},
  {id:'r6',k:5,t:'over the surveyed period.'},
  {id:'d1',k:-1,t:'The bar chart shows how many people lived in Fosbury between 1980 and 2015.'},
  {id:'d2',k:-1,t:'A new hospital and a school were also built in the town centre.'}],
 start:['r3','d1','r5','r1','r6','d2','r4','r2'],
 final:'The given maps illustrate how the suburb of Fosbury town altered from 1980 to 2015. It can be seen that the town witnessed significant developments, in terms of the introduction of an industrial feature and road layout and changes in residential and sporting facilities over the surveyed period.',
 notes:['The introduction paraphrases the question: <i>show</i> becomes <i>illustrate</i>, <i>outskirts</i> becomes <i>suburb</i>, and <i>how … altered</i> turns the years into a change over time.',
        'The overview groups the changes into categories (industrial, roads, residential, sporting) and gives no figures or small details. That is what examiners want to see.',
        'Intruder 1 describes the wrong type of visual and invents population data. Intruder 2 adds a hospital and a school, and neither is on the maps.'],
 talk:'Which words in the correct cards could you reuse in a different maps question?'},
{id:'b1',tab:'Body 1',title:'Body paragraph 1',
 brief:'Put the cards in order to describe the <strong>centre and the west</strong> of the map. Check every card against the maps before you keep it. Two cards are intruders.',
 cards:[
  {id:'r1',k:0,t:'One of the most striking alterations was that Grocer’s shop and block of flats were demolished'},
  {id:'r2',k:1,t:'to make room for a new roundabout in the center of the town,'},
  {id:'r3',k:2,t:'and more new roads were introduced.'},
  {id:'r4',k:3,t:'By 2015, terraced houses had replaced the park'},
  {id:'r5',k:4,t:'which had been relocated to the opposite side and decreased in size,'},
  {id:'r6',k:5,t:'while houses and a hotel had remained the same along the top of the maps.'},
  {id:'d1',k:-1,t:'The hotel was knocked down and replaced by a block of flats.'},
  {id:'d2',k:-1,t:'The grocer’s shop was enlarged and turned into a supermarket.'}],
 start:['r5','r1','d2','r4','r3','r6','d1','r2'],
 final:'One of the most striking alterations was that Grocer’s shop and block of flats were demolished to make room for a new roundabout in the center of the town, and more new roads were introduced. By 2015, terraced houses had replaced the park which had been relocated to the opposite side and decreased in size, while houses and a hotel had remained the same along the top of the maps.',
 notes:['<i>One of the most striking alterations</i> opens the paragraph by pointing to the biggest change first.',
        'Passive verbs (<i>were demolished</i>, <i>were introduced</i>) suit maps because the changes happen to things. <i>By 2015</i> goes with the past perfect (<i>had replaced</i>, <i>had been relocated</i>).',
        '<i>While</i> contrasts what changed with what stayed the same. Intruder 1: the hotel is in the same place on both maps. Intruder 2: the shop disappears, and the supermarket appears in a different place.'],
 talk:'Why is <i>along the top of the maps</i> a more accurate position than <i>in the top left-hand corner</i>? Where exactly are the houses and the hotel?'},

 brief:'Put the cards in order to describe the <strong>east and the south</strong>. Look for the words that tell you a new point is starting. Two cards are intruders.',
 cards:[
  {id:'r1',k:0,t:'Another change to this area was that a new supermarket and car park were erected'},
  {id:'r2',k:1,t:'on the original site of the terraced houses.'},
  {id:'r3',k:2,t:'What is more, in 1980, fields were located in the bottom right-hand corner of the map,'},
  {id:'r4',k:3,t:'but by 2015 they had been replaced with warehouses.'},
  {id:'r5',k:4,t:'As for sporting amenities, tennis courts were also converted into a sports center'},
  {id:'r6',k:5,t:'with a new car park nearby.'},
  {id:'d1',k:-1,t:'The tennis courts were kept, but a swimming pool was built next to them.'},
  {id:'d2',k:-1,t:'Warehouses were also built on the site of the park in the north-west.'}],
 start:['r4','r6','d1','r1','r3','r5','d2','r2'],
 final:'Another change to this area was that a new supermarket and car park were erected on the original site of the terraced houses. What is more, in 1980, fields were located in the bottom right-hand corner of the map, but by 2015 they had been replaced with warehouses. As for sporting amenities, tennis courts were also converted into a sports center with a new car park nearby.',
 notes:['<i>Another change</i>, <i>What is more</i> and <i>As for</i> each start a new point. They give the paragraph its shape.',
        'Useful change verbs: <i>erected</i>, <i>replaced with</i>, <i>converted into</i>. Try to use a different verb each time.',
        'Intruder 1: the tennis courts become a sports centre, and there is no swimming pool. Intruder 2: the warehouses stand where the fields were, in the south-east, and the park is still there in a smaller form.'],
 talk:'Why is <i>they had been replaced</i> correct here? Find another noun in the report that you could refer back to with <i>it</i> or <i>they</i>.'}
];

const $=(s,r=document)=>r.querySelector(s);
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const S=EX.map(()=>({start:0,acc:0,attempts:0,solved:false,sortables:[]}));
let cur=0;

function cardEl(c,exI){
  const li=document.createElement('li');li.className='card';li.dataset.id=c.id;
  li.innerHTML='<span class="grip" aria-hidden="true">⋮⋮</span><span class="txt"></span><span class="mark"></span>'+
   '<span class="tools"><button type="button" data-a="up" aria-label="Move up">↑</button><button type="button" data-a="down" aria-label="Move down">↓</button><button type="button" data-a="swap" aria-label="Move to the other box" title="Move to the other box">⇄</button></span>';
  $('.txt',li).textContent=c.t;
  return li;
}

function build(){
  const tabs=$('#tabs'),panels=$('#panels');
  EX.forEach((e,i)=>{
    const b=document.createElement('button');b.type='button';b.role='tab';b.id='tab'+i;
    b.innerHTML='<span class="tick" aria-hidden="true">✓</span>'+e.tab;
    b.onclick=()=>show(i);tabs.appendChild(b);

    const p=document.createElement('section');p.className='panel';p.id='p'+i;p.hidden=true;
    p.innerHTML=
     '<div class="phead"><h2>'+e.title+'</h2><div class="stats"><span>Time <b class="tm">00:00</b></span><span>Checks <b class="at">0</b></span></div></div>'+
     '<p class="brief">'+e.brief+' Work as a team and press Check only when everyone agrees.</p>'+
     '<div><div class="zonelabel"><span>Your paragraph</span><span>Top to bottom</span></div><ol class="zone main"></ol></div>'+
     '<div><div class="zonelabel"><span>Does not belong</span></div><ol class="zone junk"></ol></div>'+
     '<div class="actions"><button type="button" class="btn chk">Check my answer</button><div class="msg" role="status" aria-live="polite"></div></div>'+
     '<div class="notes" hidden><h3>Your finished paragraph</h3><p class="final"></p><h3>Language focus</h3><ul></ul><div class="talk"></div>'+
     '<div class="actions"><button type="button" class="btn nxt"></button></div></div>';
    panels.appendChild(p);

    const main=$('.main',p),junk=$('.junk',p);
    const byId=Object.fromEntries(e.cards.map(c=>[c.id,c]));
    e.start.forEach(id=>main.appendChild(cardEl(byId[id],i)));
    [main,junk].forEach(z=>{
      S[i].sortables.push(Sortable.create(z,{group:'g'+i,handle:'.grip',animation:150,ghostClass:'sortable-ghost',chosenClass:'sortable-chosen',
        onStart:()=>begin(i),onEnd:()=>clearMarks(i)}));
      z.addEventListener('click',ev=>{
        const btn=ev.target.closest('button[data-a]');if(!btn||S[i].solved)return;
        const li=btn.closest('li.card'),a=btn.dataset.a;begin(i);
        if(a==='up'&&li.previousElementSibling)li.parentNode.insertBefore(li,li.previousElementSibling);
        if(a==='down'&&li.nextElementSibling)li.parentNode.insertBefore(li.nextElementSibling,li);
        if(a==='swap')(li.parentNode===main?junk:main).appendChild(li);
        clearMarks(i);
      });
    });
    $('.chk',p).onclick=()=>check(i);
  });
  const rt=document.createElement('button');rt.type='button';rt.role='tab';rt.id='tab'+EX.length;rt.textContent='Team result';
  rt.onclick=()=>show(EX.length);tabs.appendChild(rt);
  const rp=document.createElement('section');rp.className='panel';rp.id='p'+EX.length;rp.hidden=true;
  rp.innerHTML='<div class="phead"><h2>Team result</h2></div><p class="brief">Show this screen to your teacher when you finish.</p>'+
    '<div class="tablewrap"><table class="res"><thead><tr><th>Task</th><th>Status</th><th>Checks</th><th>Time</th></tr></thead><tbody></tbody></table></div><p class="brief" id="resmsg"></p>';
  panels.appendChild(rp);
}

function show(i){
  cur=i;
  for(let k=0;k<=EX.length;k++){
    $('#p'+k).hidden=k!==i;
    $('#tab'+k).setAttribute('aria-selected',k===i);
  }
  if(i===EX.length)results();
}

function begin(i){const s=S[i];if(!s.start&&!s.solved)s.start=Date.now();}
function secs(i){const s=S[i];return s.acc+(s.start?Math.floor((Date.now()-s.start)/1000):0);}
setInterval(()=>{EX.forEach((e,i)=>{if(!S[i].solved)$('.tm',$('#p'+i)).textContent=fmt(secs(i));});},1000);

function clearMarks(i){
  const p=$('#p'+i);p.querySelectorAll('li.card').forEach(li=>{li.classList.remove('ok','bad');$('.mark',li).textContent='';});
  const m=$('.msg',p);m.textContent='';m.className='msg';
}
function mark(li,good){li.classList.add(good?'ok':'bad');$('.mark',li).textContent=good?'✓':'✗';}

function check(i){
  const e=EX[i],s=S[i],p=$('#p'+i);if(s.solved)return;
  begin(i);clearMarks(i);s.attempts++;$('.at',p).textContent=s.attempts;
  const info=Object.fromEntries(e.cards.map(c=>[c.id,c]));
  const realByK=[];e.cards.forEach(c=>{if(c.k>=0)realByK[c.k]=c.id;});
  const nReal=realByK.length,nDis=e.cards.length-nReal;
  const mainLis=[...$('.main',p).children],junkLis=[...$('.junk',p).children];
  const mainIds=mainLis.map(l=>l.dataset.id);
  let goodReal=0,goodDis=0;
  mainLis.forEach((li,idx)=>{
    const c=info[li.dataset.id];
    if(c.k<0){mark(li,false);return;}
    const expPrev=c.k===0?null:realByK[c.k-1];
    const actPrev=idx===0?null:mainIds[idx-1];
    const good=expPrev===actPrev;mark(li,good);if(good)goodReal++;
  });
  junkLis.forEach(li=>{const c=info[li.dataset.id];const good=c.k<0;mark(li,good);if(good)goodDis++;});
  const m=$('.msg',p);
  if(goodReal===nReal&&goodDis===nDis&&mainLis.length===nReal){solve(i);return;}
  m.className='msg bad';
  m.textContent=goodReal+' of '+nReal+' cards are in the right place. '+goodDis+' of '+nDis+' intruders spotted. Discuss and try again.';
}

function solve(i){
  const e=EX[i],s=S[i],p=$('#p'+i);
  s.acc=secs(i);s.start=0;s.solved=true;
  $('.tm',p).textContent=fmt(s.acc);
  s.sortables.forEach(x=>x.option('disabled',true));
  p.classList.add('locked');$('.chk',p).disabled=true;
  const m=$('.msg',p);m.className='msg ok';m.textContent='Correct in '+s.attempts+(s.attempts===1?' check':' checks')+'. Well done, team.';
  $('#tab'+i).classList.add('done');
  const n=$('.notes',p);n.hidden=false;
  $('.final',n).textContent=e.final;
  $('ul',n).innerHTML=e.notes.map(x=>'<li>'+x+'</li>').join('');
  $('.talk',n).innerHTML='<b>Discuss:</b> '+e.talk;
  const nx=$('.nxt',n);
  nx.textContent=i<EX.length-1?'Next: '+EX[i+1].tab:'See team result';
  nx.onclick=()=>show(i+1);
  n.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function results(){
  const tb=$('#p'+EX.length+' tbody');tb.innerHTML='';
  let all=true,tot=0,chk=0;
  EX.forEach((e,i)=>{
    const s=S[i];if(!s.solved)all=false;tot+=secs(i);chk+=s.attempts;
    const tr=document.createElement('tr');
    tr.innerHTML='<td>'+e.title+'</td><td><span class="badge'+(s.solved?' ok':'')+'">'+(s.solved?'Complete':'Not finished')+'</span></td><td>'+s.attempts+'</td><td>'+(s.solved||s.start||s.acc?fmt(secs(i)):'–')+'</td>';
    tb.appendChild(tr);
  });
  const name=$('#team').value.trim()||'Your team';
  $('#resmsg').innerHTML=all?'<b>'+name.replace(/[<>&]/g,'')+'</b> finished all three paragraphs in '+fmt(tot)+' with '+chk+' checks in total.':'Finish all three tasks to complete the report.';
}

document.querySelectorAll('button.zoom').forEach(b=>b.onclick=()=>{
  const img=$('#'+b.dataset.zoom);$('#lbimg').src=img.src;$('#lbimg').alt=img.alt;$('#lb').hidden=false;});
$('#lb').onclick=()=>{$('#lb').hidden=true;};
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#lb').hidden=true;});

build();show(0);
</script>

</body></html>
